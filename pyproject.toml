[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kgrp"
dynamic = ["version"]
description = "Mission planner for Kerbal Space Program - model orbits, transfers, and maneuvers from outside the game."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gautham Kaarthik" }]
keywords = [
    "kerbal",
    "ksp",
    "orbital-mechanics",
    "mission-planner",
    "space",
    "astrodynamics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
    "numpy",
    "scipy",
    "rich",
    "prompt-toolkit",
]

[project.optional-dependencies]
render = [
    "pyvista",
    "pyside6",
    "pyvistaqt",
    "trame",
    "trame-vtk",
    "trame-vuetify",
]

[project.scripts]
kgrp = "CLI_use.CLI:main"

# The single source of truth for the version is ``__version__`` in
# ``src/basic_systems/__init__.py`` - both the program and users can do
# ``import basic_systems; basic_systems.__version__``.
[tool.hatch.version]
source = "code"
path = "src/basic_systems/__init__.py"
expression = "__version__"

[tool.hatch.build.targets.wheel]
packages = ["src/basic_systems", "src/CLI_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
