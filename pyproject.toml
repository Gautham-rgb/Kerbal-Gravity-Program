[project]
name = "kerbalgravityprog"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyvista",
    "pyside6",
    "pyvistaqt",
    "trame",
    "trame-vtk",
    "trame-vuetify",
    "rich",
    "prompt-toolkit",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "CLI_use",
    "CLI_use.*",
    "basic_systems",
    "basic_systems.*",
]

[project.scripts]
kgrp = "CLI_use.CLI:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
